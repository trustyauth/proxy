# Example Docker Compose file for TrustyAuth proxy with an echo server
services:
  ta-proxy:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ta-proxy
    ports:
      - "80:80"
    volumes:
      - ./trustyauth-docker.yml:/etc/trustyauth.yml
    command: ["-config", "/etc/trustyauth.yml"]
    depends_on:
      - echo-server
    networks:
      - ta-network

  echo-server:
    image: hashicorp/http-echo
    container_name: echo-server
    command: ["-text", "Hello from echo-server"]
    networks:
      - ta-network

networks:
  ta-network:
    driver: bridge
