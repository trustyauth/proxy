# Base Docker Compose file with shared services
# Use with override files: docker-compose -f docker-compose.yml -f docker-compose.<mode>.yml
services:
  echo-server:
    image: hashicorp/http-echo
    container_name: echo-server
    command: ["-text", "Hello from echo-server"]
    networks:
      - ta-network

networks:
  ta-network:
    driver: bridge
